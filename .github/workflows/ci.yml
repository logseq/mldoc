name: CI

on:
  # Triggers the workflow on push or pull request events but only for the master branch
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ocaml-compiler: ["4.14.x", "5.3.x"]
        package: [mldoc, mldoc-cli, mldoc-js, mldoc-bench]
    steps:
      - uses: actions/checkout@v4

      - name: Set up OCaml
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: ${{ matrix.ocaml-compiler }}
          dune-cache: true

      - name: Install dependencies
        run: |
          opam pin add -yn mldoc .
          if [ "${{ matrix.package }}" = mldoc ]; then
            opam install ./mldoc.opam --with-doc --with-test
          else
            opam install ./${{ matrix.package }}.opam
          fi

      - uses: actions/setup-node@v4
        if: matrix.package == 'mldoc-js'
        with:
          node-version: '22'

      - name: Test installed package
        run: opam exec -- sh test/package_smoke.sh ${{ matrix.package }} "$(opam var prefix)"

      - name: Test
        if: matrix.package == 'mldoc'
        run: opam exec -- dune runtest -p mldoc
